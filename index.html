<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Wanchain Bridge Explorer - Pro View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; font-size: 15px; }
        .mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .input-pill { background: #fff; border: 2px solid #e2e8f0; padding: 14px 18px; border-radius: 14px; transition: all 0.2s; font-size: 16px; }
        .input-pill:focus { border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); outline: none; }
        .suggest-container { position: relative; }
        .suggest-list { position: absolute; top: calc(100% + 5px); left: 0; right: 0; background: white; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); z-index: 100; max-height: 240px; overflow-y: auto; display: none; }
        .suggest-item { padding: 12px 18px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .suggest-item:hover { background: #f1f5f9; color: #4f46e5; font-weight: 600; }
        .json-block { background: #1e293b; color: #94a3b8; border-radius: 12px; padding: 20px; font-size: 13px; line-height: 1.6; overflow-x: auto; }
        .result-card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 24px; }
        .badge-pct { background: #e0e7ff; color: #4338ca; font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: 800; margin-left: 4px; vertical-align: middle; }
        .header-pill { background-color: #e0e7ff; color: #4338ca; padding: 4px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; border: 1px solid #c7d2fe; }
        .header-pill button { margin-left: 8px; color: #ef4444; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; text-align: left; }
        th { background-color: #f8fafc; font-weight: 900; color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-[1600px] mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <h1 class="text-3xl font-black tracking-tight">WAN BRIDGE <span class="text-indigo-600">HUB</span></h1>
            <div class="bg-white border-2 border-slate-200 p-1 rounded-2xl flex shadow-sm">
                <button onclick="changeEnv(false)" id="btnMain" class="px-8 py-2.5 rounded-xl text-sm font-bold transition-all">主网</button>
                <button onclick="changeEnv(true)" id="btnTest" class="px-8 py-2.5 rounded-xl text-sm font-bold transition-all">测试网</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
            <div class="md:col-span-7">
                <section class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 mb-10">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="suggest-container">
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2 block ml-1">Asset 资产</label>
                            <input type="text" id="assetIn" autocomplete="off" placeholder="例如: BTC" class="input-pill w-full" oninput="showSuggestions('assetIn', 'assetSuggest', 'asset')">
                            <div id="assetSuggest" class="suggest-list"></div>
                        </div>
                        <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
                            <div class="suggest-container">
                                <label class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2 block ml-1">Network A 链</label>
                                <input type="text" id="chainA" autocomplete="off" placeholder="例如: BSC" class="input-pill w-full" oninput="showSuggestions('chainA', 'chainASuggest', 'chain')">
                                <div id="chainASuggest" class="suggest-list"></div>
                            </div>
                            <div class="suggest-container">
                                <label class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2 block ml-1">Network B 链</label>
                                <input type="text" id="chainB" autocomplete="off" placeholder="例如: Cardano" class="input-pill w-full" oninput="showSuggestions('chainB', 'chainBSuggest', 'chain')">
                                <div id="chainBSuggest" class="suggest-list"></div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-6 flex justify-between items-center">
                        <div id="dataStatus" class="text-sm font-medium text-slate-400 flex items-center gap-2">
                            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                            <span id="statusText">正在同步数据...</span>
                        </div>
                        <button onclick="doFilter()" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">Search</button>
                    </div>
                </section>
                <div id="resultsList" class="space-y-8"></div>
            </div>

            <div class="md:col-span-5 space-y-8">
                <section class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 sticky top-8">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2 block ml-1">当前 SMG ID</label>
                    <div id="smgIDDisplay" class="text-xl font-black text-indigo-600 mono break-all">
                        --
                    </div>
                    <div class="flex mt-4">
                        <input type="text" id="smgIdInput" class="input-pill w-full mr-2" placeholder="Enter new SMG ID">
                        <button onclick="updateSmgID()" class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">Update</button>
                    </div>

                    <div class="mt-10">
                        <h2 class="text-xl font-bold mb-4">CSV Generation</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">CSV Headers</label>
                                <div id="csvHeadersContainer" class="flex flex-wrap gap-2 mb-4"></div>
                                <div class="flex gap-2">
                                    <input type="text" id="newHeaderInput" class="input-pill w-full" placeholder="Add new header">
                                    <button onclick="addCsvHeader()" class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">Add</button>
                                </div>
                                <div class="mt-4 flex flex-wrap gap-2">
                                    <button onclick="addEvmHeaders()" class="px-3 py-1.5 bg-slate-100 text-slate-600 font-bold rounded-lg hover:bg-slate-200 transition text-xs">Add EVM Headers</button>
                                    <button onclick="addCardanoHeaders()" class="px-3 py-1.5 bg-slate-100 text-slate-600 font-bold rounded-lg hover:bg-slate-200 transition text-xs">Add Cardano Headers</button>
                                    <button onclick="resetCsvHeaders()" class="px-3 py-1.5 bg-rose-50 text-rose-600 font-bold rounded-lg hover:bg-rose-100 transition text-xs">Reset Headers</button>
                                </div>
                            </div>
                            <button onclick="generateCSV()" class="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">GENERATE CSV / JSON</button>
                        </div>
                    </div>

                    <div class="mt-10 pt-10 border-t border-slate-100">
                        <h2 class="text-xl font-bold mb-4">Case Update</h2>
                        <div class="space-y-4">
                            <label class="block text-sm font-medium text-slate-700">Import CSV to Update Cases</label>
                            <div class="flex gap-2">
                                <input type="file" id="caseUpdateInput" accept=".csv" class="input-pill w-full text-sm">
                                <button onclick="handleCaseUpdate()" class="px-6 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">Import</button>
                            </div>
                            <p class="text-xs text-slate-400 italic">Matches by token_pair_id, from_chain, and to_chain. Updates smg, network_fee, minServiceFee(wei), and cross_amount(eth).</p>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <section id="selectedPairsSection" class="mt-16 mb-20">
            <div class="flex justify-between items-end mb-6">
                <h2 class="text-3xl font-black tracking-tight">SELECTED <span class="text-indigo-600">TOKEN PAIRS</span></h2>
                <span class="text-sm font-bold text-slate-400" id="selectedCount">0 PAIRS SELECTED</span>
            </div>
            <div id="selectedPairsTableContainer" class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                <div class="text-center py-20"><p class="text-slate-400 font-medium">No token pairs selected.</p></div>
            </div>
        </section>
    </div>

    <div id="hexTool" class="fixed bottom-24 right-8 w-96 bg-white rounded-3xl shadow-2xl border border-slate-200 hidden z-50 overflow-hidden">
        <div class="bg-slate-900 p-5 text-white flex justify-between items-center">
            <span class="font-bold">Hex ➔ Binary 工具</span>
            <button onclick="toggleTool()" class="text-slate-400 hover:text-white text-xl">✕</button>
        </div>
        <div class="p-6 space-y-5">
            <textarea id="hexInput" class="w-full h-28 bg-slate-50 border rounded-xl p-4 mono outline-none text-sm" placeholder="粘贴 Hex 字符串..."></textarea>
            <div class="bg-indigo-50 p-4 rounded-xl">
                <span class="text-xs font-bold text-indigo-400 uppercase block mb-2">解码文本</span>
                <div id="textOutput" class="text-base font-bold text-indigo-700 break-all"></div>
            </div>
            <div class="bg-slate-900 p-4 rounded-xl">
                <span class="text-xs font-bold text-slate-500 uppercase block mb-2">二进制流</span>
                <div id="binOutput" class="text-[11px] mono text-emerald-400 h-32 overflow-y-auto leading-relaxed"></div>
            </div>
        </div>
    </div>

    <button onclick="toggleTool()" class="fixed bottom-8 right-8 w-16 h-16 bg-slate-900 text-white rounded-2xl shadow-xl flex items-center justify-center hover:scale-110 transition-transform">
        <span class="font-bold tracking-tighter">HEX</span>
    </button>

    <script>
        let isTestnet = false;
        let allPairs = [];
        let selectedPairsData = [];
        let manuallySwappedPairIDs = new Set();
        const defaultCsvHeaders = ['id', 'smg', 'token_name', 'token_pair_id', 'from_chain', 'to_chain', 'from_chain_slip44_id', 'to_chain_slip44_id', 'from_token_address', 'to_token_address', 'from_token_decimals', 'to_token_decimals', 'network_fee', 'network_fee_asset', 'minServiceFee(wei)', 'cross_amount(eth)'];
        const evmHeadersSet = ['from_coin_decimals', 'cross_amount(eth)', 'required_native_coin(wei)', 'to_address', 'bridge_type'];
        const cardanoHeadersSet = ['bridge_type', 'cross_type', 'cross_amount(eth)', 'to_address', 'required_token(wei)', 'required_ada'];
        const allRecognizedHeaders = [...new Set([...defaultCsvHeaders, ...evmHeadersSet, ...cardanoHeadersSet])];
        let csvHeaders = [...defaultCsvHeaders];
        let baseUrl = "https://bridge-api.wanchain.org/api/";
        let rawSmgID = '';
        let currentRenderedPairs = new Map();

        const shortenAddress = (address) => {
            if (typeof address !== 'string' || address.length < 10) return address;
            return `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
        };

        function toggleAddressEncoding(elementId, buttonEl) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const originalAddress = el.dataset.originalAddress;
            const currentText = el.innerText;
            if (currentText === originalAddress) {
                el.innerText = hexToUtf8(originalAddress);
                buttonEl.innerText = '编码';
            } else {
                el.innerText = originalAddress;
                buttonEl.innerText = '解码';
            }
        }

        const toEth = (wei, decimals) => {
            if (!wei || isNaN(wei) || wei === 'Error' || wei === 'Loading...') return wei;
            try {
                let totalWei = BigInt(wei) + 10n;
                let s = totalWei.toString();
                let d = parseInt(decimals);
                if (isNaN(d) || d < 0) return s;
                if (d === 0) return s;
                if (s.length <= d) {
                    s = s.padStart(d + 1, '0');
                }
                const integerPart = s.slice(0, -d);
                const fractionalPart = s.slice(-d);
                return `${integerPart}.${fractionalPart}`;
            } catch (e) {
                return 'Error';
            }
        };

        const hexToUtf8 = s => { try { return decodeURIComponent(s.replace(/\s+/g, '').replace(/[0-9a-f]{2}/g, '%$&')); } catch(e) { return s; } };

        const getDisplayName = (symbol) => {
            if (!symbol) return '';
            const decoded = hexToUtf8(symbol);
            if (decoded === symbol) {
                return symbol;
            }
            for (let i = 0; i < decoded.length; i++) {
                const charCode = decoded.charCodeAt(i);
                if (charCode < 32 || charCode > 126) return symbol;
            }
            return decoded;
        };

        async function getQuotaAndFee(f, t, id, symbol, boxId) {
            const box = document.getElementById(boxId);
            box.classList.remove('hidden');
            const jsonEl = document.getElementById(`fee-json-${id}`);
            const fields = ['min', 'max', 'net', 'ops'];
            fields.forEach(fld => { const el = document.getElementById(`${fld}_${id}`); if(el) el.innerText = "加载中..."; });
            jsonEl.innerText = 'Loading...';
            try {
                const url = `${baseUrl}quotaAndFee?fromChainType=${f}&toChainType=${t}&tokenPairID=${id}&symbol=${symbol}`;
                const response = await fetch(url);
                const res = await response.json();
                jsonEl.innerText = JSON.stringify(res, null, 2);
                if (!res.success || !res.data) throw new Error('API Error');
                const d = res.data;
                document.getElementById(`min_${id}`).innerText = d.minQuota || "0";
                document.getElementById(`max_${id}`).innerText = d.maxQuota || "无上限";
                const netV = typeof d.networkFee === 'object' ? d.networkFee.value : d.networkFee;
                document.getElementById(`net_${id}`).innerText = netV;
                if (d.networkFee) document.getElementById(`netType_${id}`).innerHTML = d.networkFee.isPercent ? '<span class="badge-pct">百分比</span>' : '';
                const opsV = typeof d.operationFee === 'object' ? d.operationFee.value : d.operationFee;
                document.getElementById(`ops_${id}`).innerText = opsV;
                if (d.operationFee) document.getElementById(`opsType_${id}`).innerHTML = d.operationFee.isPercent ? '<span class="badge-pct">百分比</span>' : '';
            } catch (e) {
                jsonEl.innerText = JSON.stringify({ error: e.message }, null, 2);
                fields.forEach(fld => { const el = document.getElementById(`${fld}_${id}`); if(el) el.innerText = "Error"; });
            }
        }

        async function syncData() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse";
            statusText.innerText = "正在同步数据...";
            try {
                const res = await fetch(baseUrl + "tokenPairs").then(r => r.json());
                allPairs = res.data || [];
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
                statusText.innerText = `已加载 ${allPairs.length} 条路径`;
                doFilter();
            } catch (e) {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
                statusText.innerText = `同步失败`;
            }
        }

        function showSuggestions(inputId, suggestId, mode) {
            const val = document.getElementById(inputId).value.trim().toLowerCase();
            const listEl = document.getElementById(suggestId);
            if (!val) { listEl.style.display = 'none'; return; }
            let pool = (mode === 'chain') ? allPairs.flatMap(p => [p.fromChain.chainName, p.toChain.chainName]) : allPairs.map(p => p.symbol);
            const uniqueMatches = [...new Set(pool)].filter(name => name.toLowerCase().startsWith(val)).sort();
            if (uniqueMatches.length > 0) {
                listEl.innerHTML = uniqueMatches.map(m => `<div class="suggest-item" onclick="selectItem('${inputId}', '${suggestId}', '${m}')">${m}</div>`).join('');
                listEl.style.display = 'block';
            } else { listEl.style.display = 'none'; }
        }

        function selectItem(inputId, suggestId, val) {
            document.getElementById(inputId).value = val;
            document.getElementById(suggestId).style.display = 'none';
        }

        function doFilter() {
            const asset = document.getElementById('assetIn').value.trim().toLowerCase();
            const valA = document.getElementById('chainA').value.trim().toLowerCase();
            const valB = document.getElementById('chainB').value.trim().toLowerCase();
            if (!asset && !valA && !valB) { document.getElementById('resultsList').innerHTML = ""; return; }
            const matches = allPairs.map(p => {
                const sym = (p.symbol || "").toLowerCase();
                const symUtf8 = hexToUtf8(p.symbol).toLowerCase();
                const fromC = (p.fromChain.chainName || "").toLowerCase();
                const toC = (p.toChain.chainName || "").toLowerCase();
                const assetMatch = !asset || sym.includes(asset) || symUtf8.includes(asset);
                if (!assetMatch) return null;
                if (valA && valB) {
                    if (fromC.includes(valA) && toC.includes(valB)) return { ...p, _isSwapped: false };
                    if (fromC.includes(valB) && toC.includes(valA)) return { ...p, _isSwapped: true };
                } else if (valA || valB) {
                    const singleTerm = valA || valB;
                    if (fromC.includes(singleTerm)) return { ...p, _isSwapped: false };
                    if (toC.includes(singleTerm)) return { ...p, _isSwapped: true };
                } else if (asset) return { ...p, _isSwapped: false };
                return null;
            }).filter(Boolean);
            renderResults(matches);
        }

        function renderResults(list) {
            const container = document.getElementById('resultsList');
            currentRenderedPairs.clear();
            if (list.length === 0) {
                container.innerHTML = `<div class='text-center py-20 text-slate-400 font-medium'>未找到匹配路径</div>`;
                return;
            }
            container.innerHTML = `<div class="mb-4 text-right"><button id="addAllBtn" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">Add All Results to Selection</button></div>` + list.map(p => {
                const name = getDisplayName(p.symbol);
                const isManuallySwapped = manuallySwappedPairIDs.has(p.tokenPairID);
                const shouldBeSwapped = isManuallySwapped ? !p._isSwapped : p._isSwapped;
                const fromChain = shouldBeSwapped ? p.toChain : p.fromChain;
                const toChain = shouldBeSwapped ? p.fromChain : p.toChain;
                const fromToken = shouldBeSwapped ? p.toToken : p.fromToken;
                const toToken = shouldBeSwapped ? p.fromToken : p.toToken;
                const directionalID = `${p.tokenPairID}_${fromChain.chainName}_${toChain.chainName}`;
                const pairForOnClick = { ...p, fromChain, toChain, fromToken, toToken, directionalID };
                currentRenderedPairs.set(directionalID, pairForOnClick);
                const isSelected = selectedPairsData.some(sp => sp.directionalID === directionalID);
                return `
                <div class="result-card overflow-hidden ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/20' : ''}">
                    <div class="p-8">
                        <div class="flex flex-col md:flex-row justify-between items-start gap-6">
                            <div class="flex items-center gap-5">
                                <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-2xl font-black">${name.substring(0,1)}</div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h3 class="text-2xl font-black text-slate-900">${name}</h3>
                                        <span class="text-[10px] px-2 py-0.5 bg-slate-100 text-slate-500 rounded-md mono font-bold">ID: ${p.tokenPairID}</span>
                                    </div>
                                    <div class="flex items-center gap-2 mt-1 text-slate-500 font-bold text-sm">
                                        <span>${fromChain.chainName}</span>
                                        <button onclick="swapPairDirection('${p.tokenPairID}')" class="p-1 rounded-md hover:bg-slate-100 text-indigo-500 text-xs font-bold">&#8646; Swap</button>
                                        <span>${toChain.chainName}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="getQuotaAndFee('${fromChain.chainType}', '${toChain.chainType}', '${p.tokenPairID}', '${name}', 'fee-box-${p.tokenPairID}')" class="px-6 py-3 font-bold rounded-xl bg-indigo-50 text-indigo-600 hover:bg-indigo-100 text-sm transition">Fees</button>
                                <button onclick="togglePairSelection('${directionalID}')" class="px-6 py-3 font-bold rounded-xl transition ${isSelected ? 'bg-slate-200 text-slate-500' : 'bg-green-500 text-white hover:bg-green-600'}">${isSelected ? 'Added' : '+'}</button>
                            </div>
                        </div>
                        <div id="fee-box-${p.tokenPairID}" class="hidden mt-6 bg-slate-50 rounded-2xl p-6 border border-slate-100">
                             <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 text-sm mb-4">
                                <div><span class="text-[10px] font-black text-slate-400 uppercase block">Min Quota</span><span id="min_${p.tokenPairID}" class="mono font-bold">--</span></div>
                                <div><span class="text-[10px] font-black text-slate-400 uppercase block">Max Quota</span><span id="max_${p.tokenPairID}" class="mono font-bold">--</span></div>
                                <div><span class="text-[10px] font-black text-slate-400 uppercase block">Net Fee</span><span id="net_${p.tokenPairID}" class="mono font-bold">--</span><span id="netType_${p.tokenPairID}"></span></div>
                                <div><span class="text-[10px] font-black text-slate-400 uppercase block">Ops Fee</span><span id="ops_${p.tokenPairID}" class="mono font-bold">--</span><span id="opsType_${p.tokenPairID}"></span></div>
                             </div>
                             <details class="group"><summary class="text-xs font-bold text-slate-400 cursor-pointer">Raw JSON</summary><div class="mt-2 json-block bg-slate-900 text-slate-300"><pre id="fee-json-${p.tokenPairID}">{}</pre></div></details>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 text-sm">
                            <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-[10px] font-black text-slate-400 uppercase">源链 Token 地址</span>
                                    <button onclick="toggleAddressEncoding('from-addr-${p.tokenPairID}', this)" class="text-xs font-bold text-indigo-500 hover:text-indigo-700 p-1">解码</button>
                                </div>
                                <code id="from-addr-${p.tokenPairID}" data-original-address="${fromToken.address}" class="mono text-slate-700 break-all">${fromToken.address}</code>
                            </div>
                            <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-[10px] font-black text-slate-400 uppercase">目标链 Token 地址</span>
                                    <button onclick="toggleAddressEncoding('to-addr-${p.tokenPairID}', this)" class="text-xs font-bold text-indigo-500 hover:text-indigo-700 p-1">解码</button>
                                </div>
                                <code id="to-addr-${p.tokenPairID}" data-original-address="${toToken.address}" class="mono text-slate-700 break-all">${toToken.address}</code>
                            </div>
                        </div>

                        <div class="mt-8">
                            <details class="group">
                                <summary class="text-sm font-bold text-slate-400 cursor-pointer hover:text-slate-600 transition flex items-center gap-2">
                                    <svg class="w-4 h-4 group-open:rotate-90 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                                    查看完整 JSON 数据
                                </summary>
                                <div class="mt-4 json-block"><pre>${JSON.stringify(pairForOnClick, null, 2)}</pre></div>
                            </details>
                        </div>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('addAllBtn')?.addEventListener('click', () => {
                for (const [id, pair] of currentRenderedPairs) { if (!selectedPairsData.some(p => p.directionalID === id)) togglePairSelection(id); }
            });
        }

        async function togglePairSelection(directionalID) {
            const pair = currentRenderedPairs.get(directionalID);
            if (!pair) return;
            const idx = selectedPairsData.findIndex(p => p.directionalID === directionalID);
            if (idx !== -1) {
                selectedPairsData.splice(idx, 1);
            } else {
                const newPair = { ...pair, network_fee: 'Loading...', 'minServiceFee(wei)': 'Loading...', smg_raw: rawSmgID };
                selectedPairsData.push(newPair);
                renderSelectedPairs();
                try {
                    const cleanSymbol = getDisplayName(pair.symbol);
                    const feeRes = await fetch(`${baseUrl}quotaAndFee?fromChainType=${pair.fromChain.chainType}&toChainType=${pair.toChain.chainType}&tokenPairID=${pair.tokenPairID}&symbol=${cleanSymbol}`).then(r => r.json());
                    if (feeRes.success && feeRes.data) {
                        const pIdx = selectedPairsData.findIndex(p => p.directionalID === directionalID);
                        if (pIdx !== -1) {
                            selectedPairsData[pIdx].network_fee = feeRes.data.networkFee?.value || '0';
                            selectedPairsData[pIdx]['minServiceFee(wei)'] = feeRes.data.operationFee?.minFeeLimit || '0';
                        }
                    }
                } catch (e) { console.error(e); }
            }
            renderSelectedPairs();
            doFilter();
        }

        function swapPairDirection(tokenPairID) {
            if (manuallySwappedPairIDs.has(tokenPairID)) manuallySwappedPairIDs.delete(tokenPairID);
            else manuallySwappedPairIDs.add(tokenPairID);
            doFilter();
        }

        async function fetchSmgID() {
            const displayEl = document.getElementById('smgIDDisplay');
            displayEl.innerText = 'Loading...';
            try {
                const res = await fetch(`${baseUrl}smgID`).then(r => r.json());
                if (res.success) {
                    rawSmgID = res.data;
                    let cleanedHex = rawSmgID.startsWith('0x') ? rawSmgID.substring(2) : rawSmgID;
                    cleanedHex = cleanedHex.replace(/^0+/, '');
                    let displaySmg = hexToUtf8(cleanedHex).replace(/[\u0000-\u001F\u007F-\u009F]/g, '').trim();
                    displayEl.innerText = displaySmg;
                }
            } catch (error) { displayEl.innerText = 'Error'; }
        }

        function updateSmgID() {
            const inputEl = document.getElementById('smgIdInput');
            const newSmgId = inputEl.value.trim();
            if (newSmgId) {
                rawSmgID = newSmgId;
                selectedPairsData.forEach(p => p.smg_raw = newSmgId);
                let cleanedHex = newSmgId.startsWith('0x') ? newSmgId.substring(2) : newSmgId;
                cleanedHex = cleanedHex.replace(/^0+/, '');
                let displaySmg = hexToUtf8(cleanedHex).replace(/[\u0000-\u001F\u007F-\u009F]/g, '').trim();
                document.getElementById('smgIDDisplay').innerText = displaySmg;
                inputEl.value = '';
                renderSelectedPairs();
            }
        }

        function renderSelectedPairs() {
            const container = document.getElementById('selectedPairsTableContainer');
            document.getElementById('selectedCount').innerText = `${selectedPairsData.length} PAIRS SELECTED`;
            if (selectedPairsData.length === 0) {
                container.innerHTML = '<div class="text-center py-20"><p class="text-slate-400 font-medium">No token pairs selected.</p></div>';
                return;
            }
            let html = `<div class="overflow-x-auto"><table><thead><tr>`;
            csvHeaders.forEach(h => html += `<th>${h.replace(/_/g, ' ')}</th>`);
            html += `<th>Action</th></tr></thead><tbody>`;
            selectedPairsData.forEach((p, idx) => {
                const rowData = {
                    id: idx + 1,
                    smg: p.smg_raw || rawSmgID,
                    token_name: getDisplayName(p.symbol),
                    token_pair_id: p.tokenPairID,
                    from_chain: p.fromChain.chainName,
                    to_chain: p.toChain.chainName,
                    from_chain_slip44_id: p.fromChain.slip44ChainID,
                    to_chain_slip44_id: p.toChain.slip44ChainID,
                    from_token_address: p.fromToken.address,
                    to_token_address: p.toToken.address,
                    from_token_decimals: p.fromToken.decimals,
                    to_token_decimals: p.toToken.decimals,
                    network_fee: p.network_fee,
                    network_fee_asset: p.fromChain.chainType,
                    'minServiceFee(wei)': p['minServiceFee(wei)'],
                    'cross_amount(eth)': toEth(p['minServiceFee(wei)'], p.fromToken.decimals)
                };
                Object.assign(rowData, p); // Incorporate custom fields from CSV import
                html += `<tr class="hover:bg-slate-50 transition">`;
                csvHeaders.forEach(h => {
                    let val = rowData[h] ?? '';
                    if (h === 'from_token_address' || h === 'to_token_address') val = `<span title="${val}">${shortenAddress(String(val))}</span>`;
                    html += `<td class="mono break-all">${val}</td>`;
                });
                html += `<td><button onclick="togglePairSelection('${p.directionalID}')" class="text-rose-500 font-bold hover:text-rose-700">Remove</button></td></tr>`;
            });
            container.innerHTML = html + `</tbody></table></div>`;
        }

        async function handleCaseUpdate() {
            const fileInput = document.getElementById('caseUpdateInput');
            if (!fileInput.files[0]) return;
            const text = await fileInput.files[0].text();
            const lines = text.split('\n').filter(l => l.trim());
            if (lines.length < 2) return;
            const csvHeadersIn = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g, ''));
            const dataRows = lines.slice(1);

            // Map incoming lowercase headers to our standard headers case-insensitively
            const headerMap = {};
            let headersAdded = false;
            csvHeadersIn.forEach(h => {
                const match = allRecognizedHeaders.find(rh => rh.toLowerCase() === h);
                if (match) {
                    headerMap[h] = match;
                    if (!csvHeaders.includes(match)) {
                        csvHeaders.push(match);
                        headersAdded = true;
                    }
                }
            });
            if (headersAdded) renderCsvHeaders();

            for (const rowStr of dataRows) {
                const vals = rowStr.split(',').map(v => v.trim().replace(/"/g, ''));
                const rowObj = {};
                csvHeadersIn.forEach((h, i) => rowObj[headerMap[h] || h] = vals[i]);

                const pID = rowObj.token_pair_id;
                const fC = rowObj.from_chain?.toLowerCase();
                const tC = rowObj.to_chain?.toLowerCase();
                if (!pID || !fC || !tC) continue;

                const basePair = allPairs.find(p => String(p.tokenPairID) === String(pID));
                if (!basePair) continue;

                let dirPair;
                if (basePair.fromChain.chainName.toLowerCase() === fC && basePair.toChain.chainName.toLowerCase() === tC) dirPair = basePair;
                else if (basePair.fromChain.chainName.toLowerCase() === tC && basePair.toChain.chainName.toLowerCase() === fC) dirPair = { ...basePair, fromChain: basePair.toChain, toChain: basePair.fromChain, fromToken: basePair.toToken, toToken: basePair.fromToken };

                if (dirPair) {
                    const directionalID = `${dirPair.tokenPairID}_${dirPair.fromChain.chainName}_${dirPair.toChain.chainName}`;
                    let existing = selectedPairsData.find(p => p.directionalID === directionalID);
                    if (!existing) {
                        existing = { ...dirPair, directionalID, network_fee: 'Loading...', 'minServiceFee(wei)': 'Loading...' };
                        selectedPairsData.push(existing);
                    }
                    Object.assign(existing, rowObj);
                    if (rowObj.smg) existing.smg_raw = rowObj.smg;
                }
            }
            renderSelectedPairs();
            fileInput.value = '';
        }

        function addCsvHeader() {
            const val = document.getElementById('newHeaderInput').value.trim();
            if (val) { val.split(',').forEach(h => { if(!csvHeaders.includes(h.trim())) csvHeaders.push(h.trim()); }); renderCsvHeaders(); renderSelectedPairs(); }
            document.getElementById('newHeaderInput').value = '';
        }
        function addEvmHeaders() { evmHeadersSet.forEach(h => { if(!csvHeaders.includes(h)) csvHeaders.push(h); }); renderCsvHeaders(); renderSelectedPairs(); }
        function addCardanoHeaders() { cardanoHeadersSet.forEach(h => { if(!csvHeaders.includes(h)) csvHeaders.push(h); }); renderCsvHeaders(); renderSelectedPairs(); }
        function resetCsvHeaders() { csvHeaders = [...defaultCsvHeaders]; renderCsvHeaders(); renderSelectedPairs(); }
        function renderCsvHeaders() { document.getElementById('csvHeadersContainer').innerHTML = csvHeaders.map(h => `<div class="header-pill">${h}<button onclick="csvHeaders=csvHeaders.filter(x=>x!=='${h}');renderCsvHeaders();renderSelectedPairs();">✕</button></div>`).join(''); }
        function generateCSV() {
            let csv = csvHeaders.join(',') + '\n';
            selectedPairsData.forEach((p, idx) => {
                const row = {
                    id: idx + 1, smg: p.smg_raw || rawSmgID, token_name: getDisplayName(p.symbol), token_pair_id: p.tokenPairID,
                    from_chain: p.fromChain.chainName, to_chain: p.toChain.chainName, from_chain_slip44_id: p.fromChain.slip44ChainID, to_chain_slip44_id: p.toChain.slip44ChainID,
                    from_token_address: p.fromToken.address, to_token_address: p.toToken.address, from_token_decimals: p.fromToken.decimals, to_token_decimals: p.toToken.decimals,
                    network_fee: p.network_fee, network_fee_asset: p.fromChain.chainType, 'minServiceFee(wei)': p['minServiceFee(wei)'],
                    'cross_amount(eth)': toEth(p['minServiceFee(wei)'], p.fromToken.decimals)
                };
                Object.assign(row, p);
                csv += csvHeaders.map(h => `"${String(row[h] ?? '').replace(/"/g, '""')}"`).join(',') + '\n';
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.setAttribute("download", "bridge_pairs.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        function changeEnv(isTest) {
            isTestnet = isTest; baseUrl = isTestnet ? "https://bridge-api.wanchain.org/api/testnet/" : "https://bridge-api.wanchain.org/api/";
            document.getElementById('btnMain').className = !isTestnet ? "px-8 py-2.5 rounded-xl text-sm font-bold bg-indigo-600 text-white shadow-lg shadow-indigo-100" : "px-8 py-2.5 rounded-xl text-sm font-bold text-slate-500 hover:text-indigo-600";
            document.getElementById('btnTest').className = isTestnet ? "px-8 py-2.5 rounded-xl text-sm font-bold bg-indigo-600 text-white shadow-lg shadow-indigo-100" : "px-8 py-2.5 rounded-xl text-sm font-bold text-slate-500 hover:text-indigo-600";
            syncData(); fetchSmgID();
        }
        function toggleTool() { document.getElementById('hexTool').classList.toggle('hidden'); }
        document.getElementById('hexInput')?.addEventListener('input', e => {
            const raw = e.target.value.replace(/^0x/, '').replace(/\s/g, '');
            let bin = ""; let text = "";
            for (let i = 0; i < raw.length; i++) {
                bin += parseInt(raw[i], 16).toString(2).padStart(4, '0') + " ";
                if (i % 2 === 1) text += String.fromCharCode(parseInt(raw.substr(i-1, 2), 16));
            }
            document.getElementById('binOutput').innerText = bin.trim();
            document.getElementById('textOutput').innerText = text;
        });
        document.addEventListener('click', e => { if (!e.target.closest('.suggest-container')) document.querySelectorAll('.suggest-list').forEach(el => el.style.display = 'none'); });
        changeEnv(false);
        renderCsvHeaders();
    </script>
</body>
</html>
